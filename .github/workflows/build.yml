name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir build_src
          unzip -q project.zip -d build_src
          ls -R build_src | head -50

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: build_src
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp build_src/app/build/outputs/apk/debug/app-debug.apk ColorTest.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ColorTest-APK
          path: ColorTest.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: Color Test v1.0 (build ${{ github.run_number }})
          body: "Developed by Wael Dahshan — برمجة وائل دهشان"
          files: ColorTest.apk
